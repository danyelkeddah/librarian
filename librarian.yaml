---
default_provider: pi
providers:
  claude:
    skills:
      default: .claude/skills/
      global: ~/.claude/skills/
    agents:
      default: .claude/agents/
      global: ~/.claude/agents/
    prompts:
      default: .claude/commands/
      global: ~/.claude/commands/
  pi:
    skills:
      default: .pi/skills/
      global: ~/.pi/agent/skills/
    prompts:
      default: .pi/prompts/
      global: ~/.pi/agent/prompts/
    pi-extensions:
      default: .pi/extensions/
      global: ~/.pi/agent/extensions/
    pi-themes:
      default: .pi/themes/
      global: ~/.pi/agent/themes/

library:
  skills:
    - name: spec-discover
      description: A Meta-Skill that interviews you about your feature, then breaks it into dependency-ordered specs for local or GitHub.
      source: https://github.com/danyelkeddah/library/blob/main/skills/spec-discover/SKILL.md
    - name: spec-plan
      description: A Meta-Skill that bridges "I need to build this" and "here's exactly how" — turning tasks into implementation-ready PRDs.
      source: https://github.com/danyelkeddah/library/blob/main/skills/spec-plan/SKILL.md
    - name: spec-execute
      description: A Meta-Skill that turns implementation plans into working code — no guessing, no skipping, verified at every step.
      source: https://github.com/danyelkeddah/library/blob/main/skills/spec-execute/SKILL.md
    - name: gitops
      description: A Meta-Skill that turns your code changes into clean commits, proper branches, and well-described PRs — automatically.
      source: https://github.com/danyelkeddah/library/blob/main/skills/gitops/SKILL.md
    - name: prime
      description: A Meta-Skill that explores and summarizes the codebase to build understanding.
      source: https://github.com/danyelkeddah/library/blob/main/skills/prime/SKILL.md
    - name: brain
      description: A Meta-skill that manages your second brain. You write, the AI classifies, links, indexes, and retrieves.
      source: https://github.com/danyelkeddah/library/blob/main/skills/brain/SKILL.md
    - name: kb
      description: A meta-skill that gives your project long-term memory. You build, the AI captures, organizes, and recalls.
      source: https://github.com/danyelkeddah/library/blob/main/skills/kb/SKILL.md
    - name: caveman
      description: A communication mode that cuts AI output ~75% without losing accuracy. You ask, the AI strips the fluff, keeps the substance.
      source: https://github.com/danyelkeddah/library/blob/main/skills/caveman/SKILL.md
    - name: grill-me
      description: Pressure-tests your plan by interrogating you one question at a time, each with a recommended answer, reading the code when it can.
      source: https://github.com/danyelkeddah/library/blob/main/skills/grill-me/SKILL.md
  agents: []
  prompts: []
  pi-extensions:
    - name: whimsical
      description: A playful Pi extension for a more whimsical agent experience.
      source: https://github.com/danyelkeddah/library/blob/main/pi-extensions/whimsical.ts
  pi-themes:
    - name: catppuccin-mocha
      description: Catppuccin Mocha theme for Pi.
      source: https://github.com/danyelkeddah/library/blob/main/pi-themes/catppuccin-mocha.json
